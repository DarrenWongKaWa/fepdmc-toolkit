name: native-validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagram-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Stages 1-5
        run: |
          python scripts/dc_stage1_exact.py --output /tmp/stage1
          python scripts/dc_stage2_cheap.py --output /tmp/stage2
          python scripts/dc_stage3_da_kernel.py --output /tmp/stage3
          python scripts/dc_stage4_native_ir.py --output /tmp/stage4
          python scripts/dc_stage5_fortran_backend.py --output /tmp/stage5
      - name: Ubuntu 22.04 gfortran image
        run: docker build -f integration/diagram_compiler/Dockerfile.u22 -t fepdmc-toolkit-u22:ci .
      - name: Pinned FEP-DMC
        run: |
          git clone --quiet https://github.com/yaoluo/FEP-DMC /tmp/fep-dmc
          git -C /tmp/fep-dmc checkout --quiet 05d08449cffdbd0dfbbbf5009add5cc887bc754b
      - name: Stage 6 and native tests
        env:
          FEPDMC_TOOLKIT_FEP_DMC: /tmp/fep-dmc
          FEPDMC_TOOLKIT_DC_DOCKER: fepdmc-toolkit-u22:ci
        run: |
          python scripts/dc_stage6_fepdmc_toolchain.py --output /tmp/stage6 --fep-dmc /tmp/fep-dmc --image fepdmc-toolkit-u22:ci
          python -m pytest -q -rs tests/test_dc_fep_dmc_validate.py tests/test_dc_golden.py
